services:
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    ports:
      - "7799:7700"
    environment:
      - MEILI_MASTER_KEY=MASTER_KEY
      - MEILI_UPGRADE_DB=true
    volumes:
      - ./meili_data:/meili_data

  inbucket:
    image: inbucket/inbucket:latest
    ports:
      - '2500:2500'
      - '9000:9000'
